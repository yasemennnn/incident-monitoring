# Start everything:  docker compose up -d --build
#
#   API + Swagger   http://localhost:8080/swagger
#   Kafka UI        http://localhost:8081

services:
  # Kafka in KRaft mode (no ZooKeeper).
  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Containers connect to kafka:9092, programs on the host machine to localhost:29092.
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Creates the two topics once and exits.
  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic incident-events --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic incident-events-dlq --partitions 1 --replication-factor 1

  # Web UI to look at topics, messages, the consumer group and the dead-letter topic.
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    # Append-only file: the dashboard counters survive a Redis restart.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: incidents
      POSTGRES_USER: incidents
      POSTGRES_PASSWORD: incidents
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidents -d incidents"]
      interval: 5s
      retries: 10

  # REST API + SignalR hub + Kafka consumer.
  api:
    build:
      context: ./backend
      dockerfile: IncidentMonitoring.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=incidents;Username=incidents;Password=incidents
      ConnectionStrings__Redis: redis:6379
      Kafka__BootstrapServers: kafka:9092
      Cors__AllowedOrigin: http://localhost:4200
      Logging__Console__FormatterName: json   # structured JSON logs
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Publishes a random event every 2 seconds.
  producer:
    build:
      context: ./backend
      dockerfile: IncidentMonitoring.Producer/Dockerfile
    environment:
      Producer__BootstrapServers: kafka:9092
      Producer__Topic: incident-events
      Producer__IntervalMs: 2000
      Logging__Console__FormatterName: json
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Angular dashboard (not implemented yet). To add it later, create ./frontend with a Dockerfile
  # that serves the built app on port 80, then uncomment:
  #
  # frontend:
  #   build: ./frontend
  #   ports:
  #     - "4200:80"
  #   depends_on:
  #     - api

volumes:
  redis-data:
  postgres-data:
